<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기본 Todo 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-800 sm:py-12">
    <!-- Todo 앱 전체 카드 -->
    <main class="mx-auto w-full max-w-xl rounded-2xl bg-white p-5 shadow-lg sm:p-6">
      <!-- 제목 영역 -->
      <header>
        <h1 class="mb-5 text-2xl font-bold">Todo App</h1>
      </header>

      <!-- 입력 영역: 할 일 입력 + 추가 버튼 -->
      <section class="mb-4 flex items-center gap-2" aria-label="할 일 입력 영역">
        <input
          id="todoInput"
          class="h-11 flex-1 rounded-lg border border-slate-300 px-3 text-sm outline-none ring-0 transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          type="text"
          placeholder="할 일을 입력하세요"
          aria-label="할 일 입력"
        />
        <button
          id="addButton"
          class="h-11 rounded-lg bg-blue-600 px-4 text-sm font-semibold text-white transition hover:bg-blue-700 active:scale-[0.99]"
          type="button"
        >
          추가
        </button>
      </section>

      <!-- Todo 목록이 들어갈 영역 -->
      <ul
        id="todoList"
        class="list-none border-t border-slate-200 pt-1"
        aria-label="할 일 목록"
      ></ul>

      <!-- 상태 영역: 전체 개수와 완료 개수를 보여줍니다 -->
      <section class="status-area" aria-label="상태 영역">
        <p id="statusText" class="mt-4 text-sm text-slate-600">총 0개 / 완료 0개</p>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
